# /etc/nginx/sites-available/harfchi.uz
server {
    listen 80;
    server_name harfchi.uz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://harfchi.uz$request_uri; }
}
server {
    listen 443 ssl;
    server_name harfchi.uz;
    ssl_certificate /etc/letsencrypt/live/harfchi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harfchi.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    # Telegram qaytish parametrlarini jurnalda saqlamang.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
